name: Keep Supabase Alive

on:
  schedule:
    # Runs daily at 06:00 UTC to prevent Supabase Free Tier auto-pause (7-day inactivity)
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Ping Vercel /api/ping Endpoint
        run: |
          echo "Pinging production endpoint: https://oil-track.vercel.app/api/ping"
          RESPONSE=$(curl -s -m 20 -w "\nHTTP_STATUS:%{http_code}" https://oil-track.vercel.app/api/ping)
          echo "$RESPONSE"
          STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS" | cut -d':' -f2)
          if [ "$STATUS" -ne 200 ]; then
            echo "⚠️ Warning: Vercel ping returned status $STATUS"
          else
            echo "✅ Vercel endpoint ping succeeded!"
          fi

      - name: 2. Ping Supabase REST API Directly
        run: |
          URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          if [ -z "$URL" ]; then
            URL="https://sabioyodeknilfrzvgja.supabase.co"
          fi
          KEY="${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          
          if [ -n "$KEY" ]; then
            echo "Pinging Supabase REST directly at $URL"
            curl -s -m 20 -i -X GET "${URL}/rest/v1/oil_products?select=id&limit=1" \
              -H "apikey: ${KEY}" \
              -H "Authorization: Bearer ${KEY}"
            echo "✅ Direct Supabase ping succeeded!"
          else
            echo "ℹ️ GitHub secret NEXT_PUBLIC_SUPABASE_ANON_KEY not configured. Step 1 keeps Supabase active via Vercel."
          fi
